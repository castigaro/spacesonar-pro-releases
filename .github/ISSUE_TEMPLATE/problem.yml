name: Report a problem
description: A bug or unexpected behaviour of SpaceSonar Pro (English or German)
title: "[Problem] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. This issue is public: no personal data, no revealing file names, no screenshots with such content. The easiest way is "Report a problem" in the app: paste the text it writes below and drag the bundle (ZIP) from the Explorer into this issue afterwards. You may write in English or German.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Text from "Report a problem"
      description: The text the app wrote (version, error id, machine facts). Without it, please name the version from the settings.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: The text and the bundle contain no personal data I would not want to see in public.
          required: true
